{% extends "base.html" %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-10 bg-white text-dark p-5 shadow-sm" style="border-radius: 15px;">
            <h1 class="fw-bold border-bottom pb-3 mb-4">{{ page.title }}</h1>
            <div class="content-area" style="line-height: 1.8;">
                {{ page.content | safe }} </div>
        </div>
    </div>
</div>
{% endblock %}
