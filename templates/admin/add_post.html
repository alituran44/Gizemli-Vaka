{% extends "admin/base.html" %}
{% block admin_content %}
<h2 class="fw-bold mb-4 text-dark"><i class="fas fa-pen-nib text-primary me-2"></i>Yeni Blog Yazısı Yayınla</h2>

<form action="{{ url_for('admin_add_post') }}" method="POST" enctype="multipart/form-data">
    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
        <div class="row g-3">
            <div class="col-12">
                <label class="small fw-bold">Blog Başlığı</label>
                <input type="text" name="title" class="form-control bg-light" placeholder="Yazı başlığını girin..." required>
            </div>

            <div class="col-md-12">
                <label class="small fw-bold">Blog Kapak Resmi</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fas fa-image text-muted"></i></span>
                    <input type="file" name="image" class="form-control" accept="image/*" required>
                </div>
                <small class="text-muted mt-1 d-block">Önerilen boyut: 1200x600px</small>
            </div>

            <div class="col-12 mt-3">
                <label class="small fw-bold mb-2 text-primary"><i class="fas fa-align-left me-1"></i>Yazı İçeriği</label>
                <textarea name="content" id="blog_editor"></textarea>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-5 py-3 rounded-pill fw-bold shadow">
            <i class="fas fa-check-circle me-2"></i>YAZIYI YAYINLA
        </button>
        <a href="{{ url_for('admin_posts') }}" class="btn btn-light px-4 py-3 rounded-pill fw-bold">İptal</a>
    </div>
</form>

<script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
<script>
    CKEDITOR.replace('blog_editor', {
        height: 400,
        placeholder: 'Yazınızı buraya yazmaya başlayın...',
        removeButtons: 'PasteFromWord'
    });
</script>
{% endblock %}
