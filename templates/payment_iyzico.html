{% extends "base.html" %}
{% block robots_meta %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<div class="py-5 bg-dark min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-danger text-white py-4">
                        <h4 class="mb-0 fw-bold"><i class="fas fa-credit-card me-2"></i>iyzico Ödeme</h4>
                    </div>
                    <div class="card-body p-4">
                        <div id="iyzipay-checkout-form" class="responsive">
                            {{ checkout_form_content|safe }}
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="{{ url_for('payment_select', case_id=case.id) }}" class="btn btn-outline-light rounded-pill px-4">
                        <i class="fas fa-arrow-left me-2"></i>Ödeme Seçeneklerine Dön
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
